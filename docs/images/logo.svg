<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64" width="100" height="64">
  <title>golog</title>
  <!-- three light-blue triangular speed lines starting at the notepad: it is moving right -->
  <g fill="#8fd0f5">
    <polygon points="48.2,15 48.2,25 3,20"/>
    <polygon points="49.5,27 49.5,37 3,32"/>
    <polygon points="50.7,39 50.7,49 3,44"/>
  </g>
  <!-- the notepad, top leaning back (left), no background fill -->
  <g transform="skewX(6)">
    <rect x="46" y="10" width="46" height="46" rx="4" fill="none" stroke="#12385f" stroke-width="3"/>
    <g stroke="#12385f" stroke-width="3" stroke-linecap="round">
      <line x1="55" y1="6" x2="55" y2="14"/>
      <line x1="69" y1="6" x2="69" y2="14"/>
      <line x1="83" y1="6" x2="83" y2="14"/>
    </g>
    <!-- "Log" over the notepad -->
    <g fill="none" stroke="#12385f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 22 V38 H60"/>
      <circle cx="68" cy="34" r="5"/>
      <circle cx="82" cy="34" r="5"/>
      <path d="M87 29 V41 Q87 47 81 47 H78"/>
    </g>
  </g>
  <!-- "Go" over the speed lines -->
  <g fill="none" stroke="#12385f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 26.5 A8.5 8.5 0 1 0 25 34 V33 H18"/>
    <circle cx="36" cy="35" r="5"/>
  </g>
</svg>
