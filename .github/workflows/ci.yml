name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/golog

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tools)"
          if test -n "${unformatted}"; then
            echo "not gofmt-clean:"; echo "${unformatted}"; exit 1
          fi
      - name: vendor tree matches go.mod
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
        continue-on-error: true

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck (informational)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true
